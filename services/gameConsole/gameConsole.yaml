apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-console
  labels:
    app: game-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-console
  template:
    metadata:
      labels:
        app: game-console
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: game-console
          image: alexsitu1/game-console:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes its pid file and temp files to /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: game-console
spec:
  selector:
    app: game-console
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: game-console
spec:
  parentRefs:
    - name: main-gateway
      namespace: kube-system
      sectionName: https
      kind: Gateway
  hostnames:
    - game-console.alexsitu.cc
  rules:
    - backendRefs:
        - name: game-console
          port: 80