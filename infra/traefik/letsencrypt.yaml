apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt
  namespace: kube-system
spec:
  acme:
    email: situalex123@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: letsencrypt
  namespace: kube-system
spec:
  secretName: default-tls-le
  dnsNames:
    - "*.alexsitu.cc"
  issuerRef:
    name: letsencrypt
    kind: Issuer
